name: CI

on:
  push:
  pull_request:

env:
  # Force every action's JS to run on Node 24, ahead of the fall 2026 removal
  # of Node 20 from GitHub-hosted runners, rather than whatever each
  # third-party action's own action.yml still declares.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
